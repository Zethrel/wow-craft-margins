name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # test_addon.py drives the addon's Lua for real and skips cleanly
      # without lupa. Installing it here is the only place that dependency
      # is worth having.
      - run: pip install lupa
      - name: Run every suite
        run: |
          status=0
          for f in test_*.py; do
            echo "== $f"
            python "$f" || status=1
          done
          exit $status
