name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # test_addon.py drives the addon's Lua for real and skips cleanly
      # without lupa. Installing it here is the only place that dependency
      # is worth having.
      - run: pip install lupa
      - name: Run every suite
        run: |
          failed=""
          for f in test_*.py; do
            echo "::group::$f"
            python "$f" || failed="$failed $f"
            echo "::endgroup::"
          done
          # Each suite prints its own PASS/FAIL lines; without this you have to
          # open every group to find out which one actually went red.
          if [ -n "$failed" ]; then
            echo "::error::failing suites:$failed"
            exit 1
          fi
          echo "all suites pass"
