name: hourly scan

# Blizzard refreshes auction data once an hour, at about :19 past. Scanning a
# few minutes after that gets the fresh snapshot; a late run is harmless
# because snapshots are keyed on Blizzard's own Last-Modified, so it stores
# the same snapshot rather than a duplicate, and an early one is a no-op.
#
# :23 rather than a round number on purpose. GitHub's scheduler is explicitly
# best-effort and queues everything behind the on-the-hour and :00/:15/:30/:45
# crowd - the first week on :20 fired once, half an hour late. An odd minute
# is the standard way out. Pullers are set to :05 and :35 so they still
# collect a publish that arrives up to forty minutes behind schedule.
on:
  schedule:
    - cron: "23 * * * *"
  # Patch day: tick `init` to re-cache recipe definitions before scanning.
  # Deliberately part of this workflow rather than one of its own, so the
  # `pages` concurrency group serialises it against the hourly cron - two jobs
  # writing the recipe cache at once would let a scan that started before the
  # init finished save a pre-patch database over it.
  workflow_dispatch:
    inputs:
      init:
        description: "Re-cache recipe definitions (patch day)"
        type: boolean
        default: false
      tier:
        description: "Limit init/names to skill tiers containing this, e.g. Midnight. Empty = every expansion (~15 min instead of ~2)"
        type: string
        default: ""
      names:
        description: "Look up names for newly priced items (~6 min). Init and names together are most of the hourly API budget; 429s only skip items, they lose nothing"
        type: boolean
        default: false

permissions:
  # write, only so a patch-day init can commit the refreshed cold-start seed.
  # Nothing else here writes, and the token cannot reach a fork: this workflow
  # never runs on pull_request.
  contents: write
  pages: write
  id-token: write
  actions: write        # only to prune this workflow's own old caches

# Pages allows one deployment at a time. Queue rather than cancel: a cancelled
# run would still have spent its Blizzard calls.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # No pip install step. wowcraft.py is standard library only, which is
      # the reason this job takes under a minute.

      # The database carries the recipe cache and the rolling price history.
      # Restoring the newest one is what makes an hourly run cheap.
      # One database per realm. History is keyed on the item and not on the
      # realm, so a shared one would blend two markets together invisibly.
      - name: Restore the databases
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: wowcraft-*.sqlite3
          key: wowcraft-db-${{ github.run_id }}
          restore-keys: wowcraft-db-

      # A realm with no database yet - first run, a new realm added to the
      # config, or an expired cache - starts from the committed recipe cache
      # rather than repeating the fifteen minutes `init` takes.
      - name: Seed any realm that has no database
        run: |
          python - <<'PY'
          import gzip, json, os, shutil
          realms = json.load(open("ci-config.json")).get("realms") or []
          for slug in realms:
              path = f"wowcraft-{slug}.sqlite3"
              if os.path.exists(path):
                  print(f"{slug}: database restored from cache")
                  continue
              with gzip.open("seed/recipes.sqlite3.gz", "rb") as src, \
                   open(path, "wb") as dst:
                  shutil.copyfileobj(src, dst)
              print(f"{slug}: cold start, seeded from seed/recipes.sqlite3.gz")
          PY

      # Without this a missing secret is just "exit code 1" in a collapsed log
      # group. Only lengths are ever printed, never any part of a value.
      #
      # Deliberately reads the two secrets by name. An earlier version listed
      # every visible secret name via toJSON(secrets) to tell a typo apart
      # from a missing entry, and GitHub's scanner blocked the workflow for
      # it - correctly, since dumping that context is exactly what
      # exfiltration looks like and no scanner can see that the jq only ever
      # emitted keys. Not worth a permanent malicious-workflow flag.
      - name: Check the credentials are configured
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          # Settings > Secrets and variables > Actions has two tabs, and a
          # client secret pasted into the Variables one is stored in clear.
          # Testing for emptiness names no value.
          ID_IN_VARS: ${{ vars.BNET_CLIENT_ID != '' }}
          SECRET_IN_VARS: ${{ vars.BNET_CLIENT_SECRET != '' }}
        run: |
          missing=""
          [ -n "$BNET_CLIENT_ID" ] || missing="$missing BNET_CLIENT_ID"
          [ -n "$BNET_CLIENT_SECRET" ] || missing="$missing BNET_CLIENT_SECRET"
          if [ -z "$missing" ]; then
            echo "client id is ${#BNET_CLIENT_ID} chars, secret ${#BNET_CLIENT_SECRET} chars"
            exit 0
          fi

          if [ "$ID_IN_VARS" = "true" ] || [ "$SECRET_IN_VARS" = "true" ]; then
            echo "::error::BNET_* is set under Variables, not Secrets. Variables are stored in clear and show up in logs - delete them there, treat the value as exposed, and re-add under the Secrets tab."
            exit 1
          fi

          echo "::error::Missing repository secret(s):$missing — add under Settings > Secrets and variables > Actions, Secrets tab. Names must match exactly, including case. Create the client at https://develop.battle.net/access/clients"
          exit 1

      # Patch day only. Recipe definitions change when the game does and not
      # otherwise, which is why the hourly run never pays for this.
      - name: Re-cache recipe definitions
        if: inputs.init
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          # Through the environment, never interpolated into the script. A
          # dispatch input substituted straight into a run: block is a shell
          # injection, dressed up as a convenience.
          TIER: ${{ inputs.tier }}
        run: |
          # Recipes and item names are realm-independent, so this runs once
          # against the first realm's database and is copied into the others
          # afterwards. Running it per realm would multiply fifteen minutes by
          # the number of realms to fetch identical answers.
          DB="wowcraft-$(python -c "import json;print(json.load(open('ci-config.json'))['realms'][0])").sqlite3"
          echo "caching into $DB"
          if [ -n "$TIER" ]; then
            echo "init, tiers matching '$TIER'"
            python wowcraft.py init -c ci-config.json -d "$DB" --tier "$TIER"
          else
            echo "init, every expansion - this takes about fifteen minutes"
            python wowcraft.py init -c ci-config.json -d "$DB"
          fi

      # New items arrive unnamed, and pricecheck searches by name.
      - name: Look up missing item names
        if: inputs.names
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          TIER: ${{ inputs.tier }}
        run: |
          DB="wowcraft-$(python -c "import json;print(json.load(open('ci-config.json'))['realms'][0])").sqlite3"
          if [ -n "$TIER" ]; then
            python wowcraft.py names -c ci-config.json -d "$DB" --tier "$TIER"
          else
            python wowcraft.py names -c ci-config.json -d "$DB"
          fi

      # Every other realm needs the same recipes, and must not lose its price
      # history to get them - so the tables are replaced in place rather than
      # the database being thrown away and re-seeded.
      - name: Copy the refreshed recipes to the other realms
        if: inputs.init || inputs.names
        run: |
          python - <<'PY'
          import json, sqlite3
          realms = json.load(open("ci-config.json"))["realms"]
          source = f"wowcraft-{realms[0]}.sqlite3"
          for slug in realms[1:]:
              target = f"wowcraft-{slug}.sqlite3"
              db = sqlite3.connect(target)
              db.execute("ATTACH DATABASE ? AS src", (source,))
              for table in ("recipe", "item"):
                  db.execute(f"DELETE FROM {table}")
                  db.execute(f"INSERT INTO {table} SELECT * FROM src.{table}")
              n = db.execute("SELECT COUNT(*) FROM recipe").fetchone()[0]
              db.commit()
              db.execute("DETACH DATABASE src")
              db.close()
              print(f"{slug}: {n} recipes copied from {realms[0]}")
          PY

      - name: Scan
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        run: |
          # History is one row per day bucketed at LOCAL midnight. A runner
          # left on UTC keys the same calendar day differently from a PC on
          # CEST, and the pulled database ends up with two entries per day
          # forever. Adopt the timezone the puller uses.
          TZ="$(python -c "import json;print(json.load(open('ci-config.json')).get('timezone') or 'UTC')")"
          export TZ
          echo "bucketing days in $TZ (now: $(date))"

          REALMS="$(python -c "import json;print(' '.join(json.load(open('ci-config.json')).get('realms') or []))")"
          if [ -z "$REALMS" ]; then
            echo "::error::no realms configured in ci-config.json"
            exit 1
          fi

          FIRST=""
          for SLUG in $REALMS; do
            echo "::group::$SLUG"
            python wowcraft.py scan -c ci-config.json \
              --realm "$SLUG" \
              --db "wowcraft-$SLUG.sqlite3" \
              --out "dashboard-$SLUG.html" \
              --publish "site/$SLUG" 2> "scan-$SLUG.log" || {
                echo "::error::scan failed for $SLUG - last lines follow"
                tail -30 "scan-$SLUG.log"
                exit 1
              }
            cat "scan-$SLUG.log"
            echo "::endgroup::"
            # The first realm is also published at the root, so anything
            # already pointing at the bare URL keeps working unchanged.
            if [ -z "$FIRST" ]; then
              FIRST="$SLUG"
              cp site/"$SLUG"/* site/
            fi
          done
          echo "published: $REALMS (root serves $FIRST)"

      - name: Save the databases
        uses: actions/cache/save@v6
        with:
          path: wowcraft-*.sqlite3
          key: wowcraft-db-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5

      # The seed is the cold-start fallback. Leaving it at pre-patch recipes
      # means that if the cache is ever evicted after a patch, the next run
      # silently scans against a stale recipe set - the failure being wrong
      # numbers rather than an error, which is the worst kind.
      #
      # After the deploy on purpose. The prices are already correct by this
      # point; a push rejected because something else landed on main first
      # should not also stop them being published.
      - name: Commit the refreshed seed
        if: inputs.init
        env:
          TIER: ${{ inputs.tier }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          DB="wowcraft-$(python -c "import json;print(json.load(open('ci-config.json'))['realms'][0])").sqlite3"
          python wowcraft.py seed -d "$DB"
          if git diff --quiet -- seed/; then
            echo "seed unchanged - nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seed/
          git commit -m "Refresh the recipe seed after an init" \
                     -m "Run ${RUN_ID}, tier filter: '${TIER:-none}'."
          # checkout leaves a detached HEAD, so name the branch explicitly.
          git push origin "HEAD:${BRANCH}"

      # A new ~18 MB cache every hour would otherwise pile up until GitHub
      # started evicting other repositories' caches to make room.
      - name: Prune old database caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key wowcraft-db- \
            --limit 100 --sort created_at --order desc \
            --json id --jq '.[3:][].id' \
          | while read -r id; do
              gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
            done
